[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web4agent"
version = "0.1.0"
description = "murl: webpage -> Markdown via Camoufox (anti-detect Firefox) + trafilatura."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "camoufox[geoip]>=0.5",
    "trafilatura>=2",
]

[project.scripts]
murl = "web4agent.murl:main"

[tool.setuptools.packages.find]
where = ["src"]
